[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sao-paulo-health-profiles"
version = "1.0.0"
description = "Reproducible socioeconomic profiles and health-resource inequalities in São Paulo"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<3", "scipy>=1.14,<2", "scikit-learn>=1.5,<2", "matplotlib>=3.9,<4", "threadpoolctl>=3.5,<4"]

[project.scripts]
sp-health = "sp_health.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
